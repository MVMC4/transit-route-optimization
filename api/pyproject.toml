[project]
name = "transitos-api"
version = "1.0.0"
description = "Geospatial transit routing and optimization API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.17,<1",
  "httpx>=0.28,<1",
  "ortools>=9.15,<10",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.21,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
