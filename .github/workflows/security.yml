name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql:
    permissions: { contents: read, security-events: write, packages: read }
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { language: [python, javascript-typescript] } }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with: { languages: "${{ matrix.language }}" }
      - uses: github/codeql-action/analyze@v4
  filesystem:
    permissions: { contents: read, security-events: write }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
      - if: always()
        uses: github/codeql-action/upload-sarif@v4
        with: { sarif_file: trivy-results.sarif }
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit && pip-audit api
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: for app in marketing rider admin docs-site; do (cd "$app" && npm audit --audit-level=high); done
        shell: bash
