version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule: { interval: weekly, day: monday, time: "04:00", timezone: Africa/Gaborone }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /marketing
    schedule: { interval: weekly, day: tuesday, time: "04:00", timezone: Africa/Gaborone }
  - package-ecosystem: npm
    directory: /rider
    schedule: { interval: weekly, day: tuesday, time: "04:10", timezone: Africa/Gaborone }
  - package-ecosystem: npm
    directory: /admin
    schedule: { interval: weekly, day: tuesday, time: "04:20", timezone: Africa/Gaborone }
  - package-ecosystem: npm
    directory: /docs-site
    schedule: { interval: weekly, day: tuesday, time: "04:30", timezone: Africa/Gaborone }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: wednesday, time: "04:00", timezone: Africa/Gaborone }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: thursday, time: "04:00", timezone: Africa/Gaborone }
