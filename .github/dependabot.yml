version: 2

# Keep routine updates visible without allowing one dependency per pull request
# to overwhelm the repository. Security alerts remain active between these runs.
updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      python-runtime:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /marketing
    schedule:
      interval: monthly
      time: "04:10"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      application-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /rider
    schedule:
      interval: monthly
      time: "04:10"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      application-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: monthly
      time: "04:10"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      application-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: monthly
      time: "04:10"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      application-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
      time: "04:10"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      application-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "04:20"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      workflow-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "04:30"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 1
    groups:
      container-images:
        patterns: ["*"]
