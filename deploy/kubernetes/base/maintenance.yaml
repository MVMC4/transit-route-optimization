apiVersion: batch/v1
kind: CronJob
metadata: { name: cleanup-auth }
spec:
  schedule: "17 * * * *"
  timeZone: Africa/Gaborone
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: tsela-runtime
          containers: [{ name: job, image: ghcr.io/replace-me/tsela-api:replace-with-immutable-sha, command: [python, -m, app.jobs.maintenance, cleanup-auth], env: [{ name: JOB_RUN_ID, valueFrom: { fieldRef: { fieldPath: metadata.name } } }], envFrom: [{ configMapRef: { name: tsela-runtime } }, { secretRef: { name: tsela-runtime-secrets } }] }]
---
