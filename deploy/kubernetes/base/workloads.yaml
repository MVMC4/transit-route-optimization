apiVersion: apps/v1
kind: Deployment
metadata: { name: api }
spec:
  replicas: 2
  selector: { matchLabels: { app: api, slot: blue } }
  template:
    metadata: { labels: { app: api, slot: blue } }
    spec:
      serviceAccountName: tsela-runtime
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: ghcr.io/replace-me/tsela-api:replace-with-immutable-sha
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: tsela-runtime } }, { secretRef: { name: tsela-runtime-secrets } }]
          resources: { requests: { cpu: 150m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
          readinessProbe: { httpGet: { path: /api/health, port: 8000 }, initialDelaySeconds: 8, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: 8000 }, initialDelaySeconds: 20, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: api }
spec: { selector: { app: api, slot: blue }, ports: [{ port: 8000, targetPort: 8000 }] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api }
spec: { minAvailable: 1, selector: { matchLabels: { app: api, slot: blue } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 8
  behavior: { scaleDown: { stabilizationWindowSeconds: 300 } }
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: marketing }
spec:
  replicas: 2
  selector: { matchLabels: { app: marketing } }
  template:
    metadata: { labels: { app: marketing } }
    spec:
      serviceAccountName: tsela-runtime
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers: [{ name: marketing, image: ghcr.io/replace-me/tsela-marketing:replace-with-immutable-sha, ports: [{ containerPort: 3000 }], resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }, volumeMounts: [{ name: next-cache, mountPath: /app/.next/cache }, { name: tmp, mountPath: /tmp }], securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } } }]
      volumes: [{ name: next-cache, emptyDir: {} }, { name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: marketing }
spec: { selector: { app: marketing }, ports: [{ port: 3000, targetPort: 3000 }] }
---
